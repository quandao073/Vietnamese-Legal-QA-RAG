name: vn-legal-rag

x-backend-common: &backend-common
  build:
    context: ./backend
    args:
      BASE_IMAGE: ${BASE_IMAGE:-python:3.11-slim}
      TORCH_INDEX: ${TORCH_INDEX:-https://download.pytorch.org/whl/cpu}
  env_file: .env
  environment:
    HF_HOME: /data/models
    DATA_DIR: /data
    QDRANT_URL: http://qdrant:6333
    DATABASE_URL: postgresql+psycopg://legal:legal@postgres:5432/legalrag
    REDIS_URL: redis://redis:6379/0
  volumes:
    - ./data:/data
    - ./docs:/app/docs

services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: legal
      POSTGRES_PASSWORD: legal
      POSTGRES_DB: legalrag
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U legal -d legalrag"]
      interval: 5s
      timeout: 3s
      retries: 20

  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 20

  qdrant:
    image: qdrant/qdrant:v1.13.2
    ports:
      - "6333:6333"
      - "6334:6334"
    volumes:
      - qdrant_storage:/qdrant/storage
    healthcheck:
      test: ["CMD-SHELL", "bash -c 'exec 3<>/dev/tcp/127.0.0.1/6333 && echo -e \"GET /readyz HTTP/1.1\\r\\nHost: localhost\\r\\n\\r\\n\" >&3 && head -c 15 <&3 | grep -q 200'"]
      interval: 5s
      timeout: 3s
      retries: 30

  api:
    <<: *backend-common
    command: >
      sh -c "alembic upgrade head &&
             uvicorn legalrag.api.app:create_app --factory --host 0.0.0.0 --port 8000 --workers 1"
    ports:
      - "8000:8000"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      qdrant:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request,sys; sys.exit(0 if urllib.request.urlopen('http://localhost:8000/api/v1/health/live').status==200 else 1)"]
      interval: 10s
      timeout: 5s
      retries: 30
      start_period: 120s

  web:
    build:
      context: ./frontend
      args:
        NEXT_PUBLIC_API_BASE: ${NEXT_PUBLIC_API_BASE:-http://localhost:8000/api/v1}
    environment:
      NEXT_PUBLIC_API_BASE: ${NEXT_PUBLIC_API_BASE:-http://localhost:8000/api/v1}
    ports:
      - "3000:3000"
    depends_on:
      - api

  ingest:
    <<: *backend-common
    profiles: ["jobs"]
    entrypoint: ["python", "-m", "legalrag.ingest"]
    depends_on:
      postgres:
        condition: service_healthy
      qdrant:
        condition: service_healthy

  eval:
    <<: *backend-common
    profiles: ["jobs"]
    entrypoint: ["python", "-m", "legalrag.eval"]
    depends_on:
      postgres:
        condition: service_healthy
      qdrant:
        condition: service_healthy
      redis:
        condition: service_healthy

volumes:
  pgdata:
  qdrant_storage:
