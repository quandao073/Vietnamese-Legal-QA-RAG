[project]
name = "legalrag"
version = "0.1.0"
description = "Vietnamese Legal QA with Retrieval-Augmented Generation"
requires-python = ">=3.11,<3.12"
dependencies = [
    "fastapi>=0.115,<1",
    "uvicorn[standard]>=0.30",
    "pydantic>=2.8",
    "pydantic-settings>=2.4",
    "sqlalchemy>=2.0,<3",
    "alembic>=1.13",
    "psycopg[binary]>=3.2",
    "qdrant-client>=1.12",
    "redis>=5.0",
    "anthropic>=2.6",
    "bm25s>=0.2",
    "pyvi>=0.1.1",
    "sentence-transformers>=3.3",
    "torch>=2.4",
    "transformers>=4.45",
    "numpy>=1.26",
    "pandas>=2.2",
    "pyarrow>=17",
    "huggingface-hub>=0.25",
    "rapidfuzz>=3.9",
    "typer>=0.12",
    "httpx>=0.27",
    "pyyaml>=6.0",
    "matplotlib>=3.9",
    "python-json-logger>=2.0",
]

[dependency-groups]
dev = [
    "pytest>=8.3",
    "pytest-asyncio>=0.24",
    "pytest-cov>=5.0",
    "ruff>=0.6",
    "mypy>=1.11",
    "types-PyYAML",
    "types-redis",
    "pandas-stubs",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["legalrag"]

[tool.uv]
index-strategy = "unsafe-best-match"

[[tool.uv.index]]
name = "pytorch-cpu"
url = "https://download.pytorch.org/whl/cpu"
explicit = true

[tool.uv.sources]
torch = [{ index = "pytorch-cpu", marker = "sys_platform != 'darwin'" }]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
markers = [
    "integration: needs Postgres/Qdrant/Redis from `make infra`",
    "slow: needs real embedding models",
]
filterwarnings = ["ignore::DeprecationWarning"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "W"]
ignore = ["B008"]

[tool.ruff.lint.per-file-ignores]
"legalrag/generation/prompts.py" = ["E501"]  # prompt prose is kept readable, not wrapped
"legalrag/eval/judge.py" = ["E501"]
"legalrag/eval/report.py" = ["E501"]  # Vietnamese report prose
"legalrag/eval/cli.py" = ["E501"]

[tool.mypy]
python_version = "3.11"
ignore_missing_imports = true
check_untyped_defs = true
warn_unused_ignores = false
plugins = ["pydantic.mypy"]
